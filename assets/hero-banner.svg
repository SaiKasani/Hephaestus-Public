<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Hephaestus — AI automation, forged into working tools for businesses across the US.">
  <defs>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14100d"/>
      <stop offset="1" stop-color="#0a0807"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9c7"/>
      <stop offset="0.5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e64a19"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#ff6a1a" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#e64a19" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0c0a09" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="440" fill="url(#iron)"/>
  <rect width="1280" height="440" fill="url(#glow)"/>
  <rect width="1280" height="4" fill="#ff8a3d" opacity="0.6"/>

  <!-- spark specks, right side -->
  <g fill="#ff8a3d" opacity="0.55">
    <circle cx="1040" cy="120" r="2"/><circle cx="1120" cy="180" r="1.5"/>
    <circle cx="980" cy="230" r="1.5"/><circle cx="1180" cy="260" r="2"/>
    <circle cx="1080" cy="320" r="1.5"/><circle cx="1220" cy="150" r="1.5"/>
    <circle cx="1015" cy="300" r="1"/><circle cx="1150" cy="350" r="1.5"/>
  </g>

  <!-- mark + wordmark -->
  <g transform="translate(80,86)">
    <g transform="scale(1.7)">
      <path d="M1 8.5 L4 7 L21 7 L21 10 L15 10 L14 13.5 L18 13.5 L19 17 L5 17 L6 13.5 L10 13.5 L9 10 L4 10 Z" fill="url(#ember)"/>
    </g>
    <text x="56" y="32" font-family="ui-monospace, 'JetBrains Mono', 'Courier New', monospace" font-size="34" font-weight="700" fill="#fafafa" letter-spacing="-0.5">Hephaest<tspan fill="#ff8a3d">us</tspan></text>
  </g>

  <!-- headline -->
  <text font-family="ui-monospace, 'JetBrains Mono', 'Courier New', monospace" fill="#fafafa" font-weight="700" letter-spacing="-1">
    <tspan x="80" y="230" font-size="60">AI, forged into</tspan>
    <tspan x="80" y="302" font-size="60" fill="#ff8a3d">working tools.</tspan>
  </text>

  <!-- subhead -->
  <text x="82" y="348" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#cbc3bb">
    AI automation studio serving businesses across the United States.
  </text>

  <!-- tech chips -->
  <g font-family="ui-monospace, 'Courier New', monospace" font-size="14" font-weight="600">
    <g transform="translate(82,374)"><rect width="120" height="34" rx="8" fill="#1c1512" stroke="#3a2f27"/><text x="60" y="22" text-anchor="middle" fill="#e9c9a8">React · TS</text></g>
    <g transform="translate(212,374)"><rect width="80" height="34" rx="8" fill="#1c1512" stroke="#3a2f27"/><text x="40" y="22" text-anchor="middle" fill="#e9c9a8">Vite</text></g>
    <g transform="translate(302,374)"><rect width="150" height="34" rx="8" fill="#1c1512" stroke="#3a2f27"/><text x="75" y="22" text-anchor="middle" fill="#e9c9a8">HTML5 Canvas</text></g>
    <g transform="translate(462,374)"><rect width="196" height="34" rx="8" fill="#241a12" stroke="#5a3f27"/><text x="98" y="22" text-anchor="middle" fill="#ff8a3d">AWS S3 · CloudFront</text></g>
  </g>
</svg>
