<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="TriangleAI — AI work for Triangle small businesses, matched by AI and approved by a human.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDFA"/>
      <stop offset="1" stop-color="#FAF2E9"/>
    </linearGradient>
    <linearGradient id="terra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D08C56"/>
      <stop offset="1" stop-color="#A5683C"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1C140C" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- page -->
  <rect width="1280" height="440" fill="url(#sky)"/>

  <!-- decorative triangle field, right side -->
  <g opacity="0.9">
    <polygon points="1040 70 1230 400 850 400" fill="url(#terra)" opacity="0.10"/>
    <polygon points="1120 150 1250 400 990 400" fill="none" stroke="#C17D4A" stroke-width="2.5" opacity="0.35"/>
    <polygon points="960 250 1060 420 860 420" fill="#C17D4A" opacity="0.07"/>
  </g>

  <!-- hairline top rule -->
  <rect x="80" y="60" width="120" height="4" rx="2" fill="#C17D4A"/>

  <!-- mark + wordmark -->
  <g transform="translate(80,92)">
    <polygon points="22 2 42 38 2 38" fill="#C17D4A" stroke="#C17D4A" stroke-width="5" stroke-linejoin="round"/>
    <text x="62" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#3D2B1A" letter-spacing="-0.5">Triangle<tspan fill="#C17D4A">AI</tspan></text>
  </g>

  <!-- headline -->
  <text font-family="Georgia, 'Times New Roman', serif" fill="#3D2B1A" font-weight="700" letter-spacing="-1">
    <tspan x="80" y="220" font-size="52">AI work for Triangle small businesses —</tspan>
    <tspan x="80" y="284" font-size="52">matched by AI, <tspan fill="#A5683C">approved by a human.</tspan></tspan>
  </text>

  <!-- subhead -->
  <text x="80" y="332" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#5A4028">
    Vetted UNC · Duke · NC State students deliver real AI &amp; automation, at student rates.
  </text>

  <!-- tech chips -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(80,366)">
      <rect width="118" height="34" rx="17" fill="#F0E8DF"/>
      <text x="59" y="22" text-anchor="middle" fill="#5A4028">React · TS</text>
    </g>
    <g transform="translate(208,366)">
      <rect width="104" height="34" rx="17" fill="#F0E8DF"/>
      <text x="52" y="22" text-anchor="middle" fill="#5A4028">Supabase</text>
    </g>
    <g transform="translate(322,366)">
      <rect width="120" height="34" rx="17" fill="#FFF1E2"/>
      <text x="60" y="22" text-anchor="middle" fill="#A5683C">Claude API</text>
    </g>
    <g transform="translate(452,366)">
      <rect width="150" height="34" rx="17" fill="#F0E8DF"/>
      <text x="75" y="22" text-anchor="middle" fill="#5A4028">Postgres · RLS</text>
    </g>
  </g>
</svg>
