<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hephaestus">
  <!--
    THE HAMMER, AS A CONSTELLATION. The night half of the sheet is a star
    atlas, so the mark is the tool drawn the way an atlas draws a figure:
    named stars at the joints, thin lines between them.

    It has to survive 16px, where a 1px line at this viewBox is a quarter of
    a device pixel. So it is drawn twice — a low-opacity filled silhouette
    that carries the SHAPE at tab size, and the constellation itself on top,
    which only resolves from about 32px up. Same drawing, two reading
    distances.

    Colours are the sheet's own night: NIGHT(0.74) ground, gold accent.
  -->
  <defs>
    <radialGradient id="sky" cx="0.62" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#1d2b55"/>
      <stop offset="0.55" stop-color="#111b39"/>
      <stop offset="1" stop-color="#080c1c"/>
    </radialGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="0.32" stop-color="#f0dcae" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c9a24a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#sky)"/>

  <!-- field stars, so the tile reads as sky and not as a dark card -->
  <g fill="#e8dfc8">
    <circle cx="12" cy="14" r="0.7" opacity="0.55"/>
    <circle cx="53" cy="45" r="0.8" opacity="0.5"/>
    <circle cx="19" cy="27" r="0.55" opacity="0.4"/>
    <circle cx="45" cy="8"  r="0.6" opacity="0.45"/>
    <circle cx="9"  cy="41" r="0.5" opacity="0.35"/>
    <circle cx="57" cy="26" r="0.55" opacity="0.4"/>
    <circle cx="33" cy="55" r="0.6" opacity="0.4"/>
  </g>

  <!-- the mass: what survives at 16px -->
  <g fill="#c9a24a" opacity="0.34">
    <path d="M38 11 L54.5 19 L47.5 32.5 L31 24.5 Z"/>
    <path d="M37.6 26.6 L42.2 28.9 L18.6 52 L15.2 48.6 Z"/>
  </g>

  <!-- the constellation: joints and the lines between them -->
  <g fill="none" stroke="#e6d9b4" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" opacity="0.92">
    <path d="M38 11 L54.5 19 L47.5 32.5 L31 24.5 Z"/>
    <path d="M39.9 27.8 L16.9 50.3"/>
  </g>

  <g>
    <circle cx="38"   cy="11"   r="4.1" fill="url(#star)"/>
    <circle cx="54.5" cy="19"   r="3.5" fill="url(#star)"/>
    <circle cx="47.5" cy="32.5" r="3.5" fill="url(#star)"/>
    <circle cx="31"   cy="24.5" r="3.8" fill="url(#star)"/>
    <circle cx="16.9" cy="50.3" r="4.8" fill="url(#star)"/>
    <circle cx="28.4" cy="39.1" r="2.7" fill="url(#star)"/>
  </g>
  <g fill="#fffdf6">
    <circle cx="38"   cy="11"   r="1.9"/>
    <circle cx="54.5" cy="19"   r="1.55"/>
    <circle cx="47.5" cy="32.5" r="1.55"/>
    <circle cx="31"   cy="24.5" r="1.7"/>
    <circle cx="16.9" cy="50.3" r="2.2"/>
    <circle cx="28.4" cy="39.1" r="1.15"/>
  </g>
</svg>
