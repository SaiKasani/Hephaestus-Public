<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Matching engine scoring weights">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C17D4A"/>
      <stop offset="1" stop-color="#A5683C"/>
    </linearGradient>
    <linearGradient id="barTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D49160"/>
      <stop offset="1" stop-color="#C17D4A"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#1C140C" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="900" height="430" rx="20" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="40" y="34" width="64" height="4" rx="2" fill="#C17D4A"/>
  <text x="40" y="74" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#3D2B1A">How fit is scored</text>
  <text x="40" y="100" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8A7B6B">Same weights drive the Claude ranker and the deterministic fallback scorer.</text>

  <g font-family="'Helvetica Neue', Arial, sans-serif">
    <!-- row template: label, bar, value -->
    <!-- Skill overlap 0.30 -->
    <g transform="translate(40,128)">
      <text x="0" y="22" font-size="15" font-weight="600" fill="#3D2B1A">Skill overlap</text>
      <rect x="250" y="6" width="480" height="24" rx="6" fill="url(#barTop)"/>
      <text x="742" y="24" font-size="15" font-weight="700" fill="#A5683C">0.30</text>
    </g>
    <!-- Budget rate 0.18 -->
    <g transform="translate(40,176)">
      <text x="0" y="22" font-size="15" font-weight="600" fill="#3D2B1A">Budget ↔ rate fit</text>
      <rect x="250" y="6" width="288" height="24" rx="6" fill="url(#bar)"/>
      <text x="550" y="24" font-size="15" font-weight="700" fill="#A5683C">0.18</text>
    </g>
    <!-- Availability timeline 0.14 -->
    <g transform="translate(40,224)">
      <text x="0" y="22" font-size="15" font-weight="600" fill="#3D2B1A">Availability ↔ timeline</text>
      <rect x="250" y="6" width="224" height="24" rx="6" fill="url(#bar)"/>
      <text x="486" y="24" font-size="15" font-weight="700" fill="#A5683C">0.14</text>
    </g>
    <!-- Complexity level 0.14 -->
    <g transform="translate(40,272)">
      <text x="0" y="22" font-size="15" font-weight="600" fill="#3D2B1A">Complexity ↔ student level</text>
      <rect x="250" y="6" width="224" height="24" rx="6" fill="url(#bar)"/>
      <text x="486" y="24" font-size="15" font-weight="700" fill="#A5683C">0.14</text>
    </g>
    <!-- Interest 0.12 -->
    <g transform="translate(40,320)">
      <text x="0" y="22" font-size="15" font-weight="600" fill="#3D2B1A">Interest / industry alignment</text>
      <rect x="250" y="6" width="192" height="24" rx="6" fill="url(#bar)"/>
      <text x="454" y="24" font-size="15" font-weight="700" fill="#A5683C">0.12</text>
    </g>
    <!-- Location 0.12 -->
    <g transform="translate(40,368)">
      <text x="0" y="22" font-size="15" font-weight="600" fill="#3D2B1A">Location / remote fit</text>
      <rect x="250" y="6" width="192" height="24" rx="6" fill="url(#bar)"/>
      <text x="454" y="24" font-size="15" font-weight="700" fill="#A5683C">0.12</text>
    </g>
  </g>
</svg>
